name: AlphaBreastScan
options:
  bundleIdPrefix: com.alphabreast
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ScanCore:
    path: Packages/ScanCore
targets:
  AlphaBreastScan:
    type: application
    platform: iOS
    sources:
      - path: AlphaBreastScan
    dependencies:
      - package: ScanCore
    entitlements:
      path: AlphaBreastScan/Resources/AlphaBreastScan.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    info:
      path: AlphaBreastScan/Resources/Info.plist
      properties:
        CFBundleDisplayName: AlphaBreast Scan
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: ใช้กล้องและ LiDAR เพื่อสแกนลำตัวส่วนหน้าเป็นโมเดล 3 มิติ ข้อมูลอยู่ในเครื่องนี้เท่านั้น
        NSFaceIDUsageDescription: ใช้ Face ID เพื่อปลดล็อกแอปก่อนเข้าถึงข้อมูลสแกน
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        # SHA-256 of the alpha code, from Config/Local.xcconfig. Empty disables the code prompt.
        ABAlphaCodeSHA256: $(AB_ALPHA_CODE_SHA256)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AB_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(AB_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
    scheme: {}
