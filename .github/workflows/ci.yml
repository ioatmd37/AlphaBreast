name: CI

on:
  push:
  pull_request:

jobs:
  scancore-linux:
    name: ScanCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/ScanCore

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: ScanCore tests
        run: swift test --package-path Packages/ScanCore
      - name: Generate project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project AlphaBreastScan.xcodeproj \
            -scheme AlphaBreastScan \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
